<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Glow and Gradient Definitions -->
    <radialGradient id="globeGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EBF3FF" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#D1E3FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A5C9FF" stop-opacity="0.2" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2C59" flood-opacity="0.10" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Decorative Grid / Orbit Rings -->
  <circle cx="400" cy="330" r="280" fill="none" stroke="#2563EB" stroke-width="1" stroke-dasharray="4 8" opacity="0.15" />
  <circle cx="400" cy="330" r="240" fill="none" stroke="#2563EB" stroke-width="1" opacity="0.08" />

  <!-- Globe Base Sphere -->
  <circle cx="400" cy="330" r="200" fill="url(#globeGrad)" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.3" filter="url(#softShadow)" />

  <!-- Globe Latitudes & Longitudes Lines -->
  <g stroke="#2563EB" stroke-width="1" stroke-opacity="0.2" fill="none">
    <!-- Longitudes -->
    <ellipse cx="400" cy="330" rx="200" ry="200" />
    <ellipse cx="400" cy="330" rx="140" ry="200" />
    <ellipse cx="400" cy="330" rx="70" ry="200" />
    <!-- Latitudes -->
    <ellipse cx="400" cy="330" rx="200" ry="140" />
    <ellipse cx="400" cy="330" rx="200" ry="70" />
    <line x1="200" y1="330" x2="600" y2="330" />
    <line x1="400" y1="130" x2="400" y2="530" />
  </g>

  <!-- Connection Arcs from Altimi Biosciences Hub (400, 360) to Partners -->
  <g fill="none" stroke-dasharray="5 5" stroke-width="1.5">
    <!-- To Randox (Left Top) -->
    <path d="M400,360 Q300,240 280,210" stroke="#3B82F6" opacity="0.7" />
    <!-- To Aidian (Center Top) -->
    <path d="M400,360 Q390,240 380,215" stroke="#3B82F6" opacity="0.7" />
    <!-- To Bittium (Right Top) -->
    <path d="M400,360 Q520,240 540,225" stroke="#3B82F6" opacity="0.7" />
    <!-- To A&D Medical (Far Right Mid) -->
    <path d="M400,360 Q510,310 525,320" stroke="#3B82F6" opacity="0.7" />
  </g>

  <!-- Altimi Biosciences Hub Marker (Source) - width adjusted for text length -->
  <circle cx="400" cy="360" r="6" fill="#EF4444" filter="url(#glow)" />
  <circle cx="400" cy="360" r="14" fill="#EF4444" opacity="0.3" />
  <rect x="340" y="375" width="120" height="24" rx="6" fill="#0F172A" opacity="0.95" />
  <text x="400" y="391" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Altimi Biosciences</text>

  <!-- Partner Destination Nodes on Globe -->
  <circle cx="280" cy="210" r="4.5" fill="#2563EB" /><circle cx="280" cy="210" r="9" fill="#2563EB" opacity="0.3" />
  <circle cx="380" cy="215" r="4.5" fill="#2563EB" /><circle cx="380" cy="215" r="9" fill="#2563EB" opacity="0.3" />
  <circle cx="540" cy="225" r="4.5" fill="#2563EB" /><circle cx="540" cy="225" r="9" fill="#2563EB" opacity="0.3" />
  <circle cx="525" cy="320" r="4.5" fill="#2563EB" /><circle cx="525" cy="320" r="9" fill="#2563EB" opacity="0.3" />

  <!-- FLOATING PROFESSIONAL CARDS (With Clean Content) -->

  <!-- Card 1: Top Right (100% Authentic) -->
  <g transform="translate(620, 45)" filter="url(#softShadow)">
    <rect width="150" height="55" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="28" cy="27" r="16" fill="#EFF6FF" />
    <!-- Check Shield Icon -->
    <path d="M28 19L33 21.5V25.5C33 28.5 30.8 31.2 28 32C25.2 31.2 23 28.5 23 25.5V21.5L28 19Z" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M25.5 27L27 28.5L30.5 25" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="54" y="25" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="700">100% Verified</text>
    <text x="54" y="40" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="500">DRAP Registered</text>
  </g>

  <!-- Card 2: Top Left (Randox / UK) -->
  <g transform="translate(100, 180)" filter="url(#softShadow)">
    <rect width="145" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="26" cy="25" r="14" fill="#EFF6FF" />
    <text x="26" y="29" fill="#2563EB" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">UK</text>
    <text x="50" y="23" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="700">Randox Labs</text>
    <text x="50" y="38" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="600">● Direct Principal</text>
  </g>

  <!-- Card 3: Top Center (Aidian / Finland) -->
  <g transform="translate(410, 80)" filter="url(#softShadow)">
    <rect width="145" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="26" cy="25" r="14" fill="#EFF6FF" />
    <text x="26" y="29" fill="#2563EB" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">FIN</text>
    <text x="50" y="23" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="700">Aidian Diagnostics</text>
    <text x="50" y="38" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="500">Point-of-Care</text>
  </g>

  <!-- Card 4: Right Mid (A&D Medical / Japan) -->
  <g transform="translate(560, 200)" filter="url(#softShadow)">
    <rect width="155" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="26" cy="25" r="14" fill="#EFF6FF" />
    <text x="26" y="29" fill="#2563EB" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">JPN</text>
    <text x="50" y="23" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="700">A&amp;D Medical</text>
    <text x="50" y="38" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="500">Precision Monitors</text>
  </g>

  <!-- Card 5: Right Lower (Cold Chain Support) -->
  <g transform="translate(530, 420)" filter="url(#softShadow)">
    <rect width="155" height="55" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="28" cy="27" r="16" fill="#EFF6FF" />
    <!-- Temp / Gauge Icon -->
    <path d="M28 19V28M25 25L28 28L31 25" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="54" y="25" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="700">Cold Chain 24/7</text>
    <text x="54" y="40" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="500">Validated Logistics</text>
  </g>

  <!-- Card 6: Bottom Left (Diagnostics & Reagents) -->
  <g transform="translate(110, 430)" filter="url(#softShadow)">
    <rect width="160" height="55" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="28" cy="27" r="16" fill="#EFF6FF" />
    <!-- Pulse / ECG Icon -->
    <path d="M20 27H24L26.5 21L30 33L32.5 26L34 27H37" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="54" y="25" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="700">Clinical Reagents</text>
    <text x="54" y="40" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="500">ISO 13485 Standards</text>
  </g>

  <!-- Card 7: Bottom Center (Global Supply) -->
  <g transform="translate(300, 500)" filter="url(#softShadow)">
    <rect width="155" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="26" cy="25" r="14" fill="#EFF6FF" />
    <!-- Capsule / Supply Icon -->
    <path d="M23 25L29 19M25 29L31 23" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" />
    <text x="50" y="23" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="700">Direct Import</text>
    <text x="50" y="38" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="500">Institution-Wide Supply</text>
  </g>
</svg>

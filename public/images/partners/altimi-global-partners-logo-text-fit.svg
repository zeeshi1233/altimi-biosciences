<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">Altimi Biosciences global partner network</title>
<desc id="desc">A luminous cobalt and cyan globe connecting Altimi Biosciences to international healthcare partners.</desc>
<defs>
  <radialGradient id="space" cx="50%" cy="48%" r="60%">
    <stop offset="0" stop-color="#0C3C78" stop-opacity=".65"/>
    <stop offset=".62" stop-color="#061D3B" stop-opacity=".2"/>
    <stop offset="1" stop-color="#031326" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="globe" cx="34%" cy="28%" r="75%">
    <stop offset="0" stop-color="#77E8FF"/>
    <stop offset=".25" stop-color="#238FEA"/>
    <stop offset=".65" stop-color="#0756B8"/>
    <stop offset="1" stop-color="#032D69"/>
  </radialGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#8AF7FF"/><stop offset=".48" stop-color="#168DFF"/><stop offset="1" stop-color="#D4FBFF"/>
  </linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#0AA9FF" stop-opacity=".1"/><stop offset=".5" stop-color="#59F0FF"/><stop offset="1" stop-color="#176EFF" stop-opacity=".1"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF5FF"/>
  </linearGradient>
  <filter id="blueGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
    <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity=".45"/>
  </filter>
  <clipPath id="clip"><circle cx="380" cy="310" r="166"/></clipPath>
  <style>
    .orbit{fill:none;stroke:#28BFFF;stroke-opacity:.55;stroke-width:1.5;transform-origin:380px 310px}
    .spin{animation:spin 28s linear infinite}.back{animation:back 36s linear infinite}
    .route{fill:none;stroke:url(#line);stroke-width:2;stroke-dasharray:4 9;stroke-linecap:round;animation:dash 6s linear infinite}
    .grid{fill:none;stroke:#B9F5FF;stroke-opacity:.25;stroke-width:1.1}
    .card{filter:url(#shadow);animation:float 5.5s ease-in-out infinite}
    .card:nth-of-type(2n){animation-delay:-2.5s}
    .cardbg{fill:url(#card);stroke:#FFFFFF;stroke-opacity:.95;stroke-width:1}
    .name{font:700 11.5px Inter,Arial,sans-serif;fill:#092443}
    .sub{font:10px Inter,Arial,sans-serif;fill:#58718C}
    .tag{font:700 9px Inter,Arial,sans-serif;fill:#0877D9}
    .globeSurface{transform-box:view-box;transform-origin:380px 310px;animation:globeTurn 18s ease-in-out infinite}
    .landMasses{animation:landDrift 18s ease-in-out infinite}
    .shine{animation:shine 7s ease-in-out infinite}
    @keyframes spin{to{transform:rotate(360deg)}}@keyframes back{to{transform:rotate(-360deg)}}
    @keyframes dash{to{stroke-dashoffset:-52}}@keyframes float{0%,100%{translate:0 0}50%{translate:0 -5px}}
    @keyframes globeTurn{0%,100%{transform:perspective(700px) rotateY(0deg) scaleX(1)}25%{transform:perspective(700px) rotateY(16deg) scaleX(.94)}50%{transform:perspective(700px) rotateY(0deg) scaleX(1)}75%{transform:perspective(700px) rotateY(-16deg) scaleX(.94)}}
    @keyframes landDrift{0%,100%{translate:0 0}50%{translate:9px 0}}
    @keyframes shine{0%,100%{opacity:.22}50%{opacity:.65}}
    @keyframes pulse{0%,100%{opacity:.5;scale:.88}50%{opacity:1;scale:1.12}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</defs>

<!-- soft ambient field -->
<circle cx="380" cy="310" r="280" fill="url(#space)"/>
<ellipse class="orbit spin" cx="380" cy="310" rx="290" ry="112" transform="rotate(-25 380 310)"/>
<ellipse class="orbit back" cx="380" cy="310" rx="270" ry="156" transform="rotate(34 380 310)" stroke-dasharray="5 9"/>
<ellipse class="orbit" cx="380" cy="310" rx="224" ry="198" transform="rotate(72 380 310)" stroke-opacity=".18"/>

<!-- partner connection paths -->
<g>
 <path class="route" d="M380 310Q245 215 115 170"/>
 <path class="route" d="M380 310Q425 170 530 115"/>
 <path class="route" d="M380 310Q535 245 600 260"/>
 <path class="route" d="M380 310Q535 395 560 470"/>
 <path class="route" d="M380 310Q260 420 160 470"/>
 <path class="route" d="M380 310Q380 460 380 550"/>
</g>

<!-- globe -->
<circle cx="380" cy="310" r="178" fill="#087BFF" opacity=".15" filter="url(#blueGlow)"/>
<circle cx="380" cy="310" r="166" fill="url(#globe)" stroke="url(#edge)" stroke-width="2.5"/>
<g clip-path="url(#clip)">
 <g class="globeSurface">
 <g class="grid">
  <ellipse cx="380" cy="310" rx="166" ry="50"/><ellipse cx="380" cy="310" rx="166" ry="105"/>
  <ellipse cx="380" cy="310" rx="166" ry="143"/>
  <ellipse cx="380" cy="310" rx="55" ry="166"/><ellipse cx="380" cy="310" rx="110" ry="166"/>
  <ellipse cx="380" cy="310" rx="143" ry="166"/>
  <path d="M214 310H546M380 144V476"/>
 </g>
 <!-- simplified luminous land masses -->
 <g class="landMasses" fill="#BDF8FF" opacity=".7">
  <path d="M260 205l22-16 30 5 18 20-12 18-25 5-9 22-22-8-10-24z"/>
  <path d="M310 268l25 10 15 30-10 38-22 28-13-24 5-30-16-22z"/>
  <path d="M394 188l31-12 32 15 18 27-14 20-28-5-15 18-19-17z"/>
  <path d="M420 280l34-10 29 21-6 37-27 20-21-14-19-27z"/>
  <path d="M473 378l24 10 10 21-19 18-22-13z"/>
 </g>
 <path class="shine" d="M230 220Q380 100 530 220" fill="none" stroke="#D7FBFF" stroke-opacity=".75" stroke-width="2"/>
 </g>
</g>
<circle cx="380" cy="310" r="166" fill="none" stroke="#B5F6FF" stroke-opacity=".55"/>

<!-- central Altimi hub: clean symbol-only mark, no overflowing wordmark -->
<circle cx="380" cy="310" r="42" fill="#008BFF" opacity=".22" filter="url(#blueGlow)"/>
<circle cx="380" cy="310" r="32" fill="#F5FBFF" stroke="#66E6FF" stroke-width="2.2"/>
<g fill="#087AC8" transform="translate(0 -11)">
 <circle cx="380" cy="297" r="8"/><circle cx="366" cy="307" r="7"/><circle cx="394" cy="307" r="7"/>
 <rect x="371" y="304" width="18" height="12" rx="6"/>
</g>
<text x="380" y="315" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="6.8" font-weight="700"
      letter-spacing="-.12" fill="#C32236">ALTIMI</text>
<text x="380" y="323" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="6.8" font-weight="700"
      letter-spacing="-.18" fill="#C32236">BIOSCIENCES</text>
<text x="380" y="331" text-anchor="middle"
      font-family="Arial, sans-serif" font-size="6.4" font-weight="700"
      letter-spacing="-.08" fill="#C32236">PVT. LTD.</text>
<circle cx="380" cy="310" r="48" fill="none" stroke="#73EFFF" stroke-opacity=".75" class="orbit spin"/>
<circle cx="380" cy="310" r="25" fill="none" stroke="#0C78C8" stroke-opacity=".14" stroke-width="1"/>

<!-- bright endpoint nodes -->
<g fill="#8CF5FF" filter="url(#blueGlow)">
 <circle cx="275" cy="244" r="4"/><circle cx="430" cy="175" r="4"/><circle cx="520" cy="265" r="4"/>
 <circle cx="480" cy="420" r="4"/><circle cx="270" cy="405" r="4"/><circle cx="380" cy="466" r="4"/>
</g>

<!-- partner cards -->
<g class="card" transform="translate(12 145)">
 <rect class="cardbg" width="182" height="58" rx="13"/>
 <circle cx="29" cy="29" r="17" fill="#D8EEFF"/><text class="tag" x="29" y="32" text-anchor="middle">UK</text>
 <text class="name" x="55" y="25" textLength="118" lengthAdjust="spacingAndGlyphs">Randox Laboratories</text><text class="sub" x="55" y="41" textLength="104" lengthAdjust="spacingAndGlyphs">Diagnostic solutions</text>
 <circle cx="166" cy="15" r="3" fill="#10B981"/>
</g>
<g class="card" transform="translate(502 68)">
 <rect class="cardbg" width="210" height="58" rx="13"/>
 <circle cx="29" cy="29" r="17" fill="#D8EEFF"/><text class="tag" x="29" y="32" text-anchor="middle">FIN</text>
 <text class="name" x="55" y="25" textLength="130" lengthAdjust="spacingAndGlyphs">Aidian Diagnostics</text><text class="sub" x="55" y="41" textLength="133" lengthAdjust="spacingAndGlyphs">Point-of-care technology</text>
 <circle cx="194" cy="15" r="3" fill="#10B981"/>
</g>
<g class="card" transform="translate(548 235)">
 <rect class="cardbg" width="190" height="58" rx="13"/>
 <circle cx="29" cy="29" r="17" fill="#D8EEFF"/><text class="tag" x="29" y="32" text-anchor="middle">JPN</text>
 <text class="name" x="55" y="25" textLength="108" lengthAdjust="spacingAndGlyphs">A&amp;D Medical</text><text class="sub" x="55" y="41" textLength="112" lengthAdjust="spacingAndGlyphs">Precision monitors</text>
 <circle cx="164" cy="15" r="3" fill="#10B981"/>
</g>
<g class="card" transform="translate(520 445)">
 <rect class="cardbg" width="202" height="58" rx="13"/>
 <circle cx="29" cy="29" r="17" fill="#D8EEFF"/><path d="M29 19v13m-5-5 5 5 5-5" fill="none" stroke="#0877D9" stroke-width="2" stroke-linecap="round"/>
 <text class="name" x="55" y="25" textLength="112" lengthAdjust="spacingAndGlyphs">Cold Chain 24/7</text><text class="sub" x="55" y="41" textLength="104" lengthAdjust="spacingAndGlyphs">Validated logistics</text>
 <circle cx="186" cy="15" r="3" fill="#10B981"/>
</g>
<g class="card" transform="translate(16 442)">
 <rect class="cardbg" width="202" height="58" rx="13"/>
 <circle cx="29" cy="29" r="17" fill="#D8EEFF"/><path d="M18 29h7l4-8 5 16 4-8h5" fill="none" stroke="#0877D9" stroke-width="2" stroke-linecap="round"/>
 <text class="name" x="55" y="25" textLength="112" lengthAdjust="spacingAndGlyphs">Clinical Reagents</text><text class="sub" x="55" y="41" textLength="112" lengthAdjust="spacingAndGlyphs">Quality-led diagnostics</text>
 <circle cx="186" cy="15" r="3" fill="#10B981"/>
</g>
<g class="card" transform="translate(280 540)">
 <rect class="cardbg" width="200" height="58" rx="13"/>
 <circle cx="29" cy="29" r="17" fill="#D8EEFF"/><path d="M22 29h14m-7-7v14" stroke="#0877D9" stroke-width="2" stroke-linecap="round"/>
 <text class="name" x="55" y="25" textLength="94" lengthAdjust="spacingAndGlyphs">Direct Import</text><text class="sub" x="55" y="41" textLength="112" lengthAdjust="spacingAndGlyphs">Institution-wide supply</text>
 <circle cx="184" cy="15" r="3" fill="#10B981"/>
</g>
<!-- verified marker -->
<g class="card" transform="translate(22 48)">
 <rect class="cardbg" width="192" height="48" rx="12"/>
 <circle cx="25" cy="24" r="12" fill="#D8EEFF"/><path d="M19 24l4 4 8-9" fill="none" stroke="#0877D9" stroke-width="2" stroke-linecap="round"/>
 <text class="name" x="47" y="21">Verified Distribution</text><text class="sub" x="47" y="35">DRAP registered in Pakistan</text>
</g>
</svg>